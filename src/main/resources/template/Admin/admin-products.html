<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Panel - Products</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      display: flex;
      min-height: 100vh;
      background-color: #f4f4f4;
      font-family: 'Segoe UI', sans-serif;
    }

    .sidebar {
      width: 220px;
      background-color: #1f1f1f;
      color: white;
      padding: 30px 15px;
    }

    .sidebar h2 {
      margin-bottom: 30px;
      font-size: 1.6rem;
    }

    .sidebar a {
      display: block;
      color: white;
      padding: 12px 10px;
      text-decoration: none;
      border-radius: 6px;
      margin-bottom: 10px;
      transition: background 0.3s;
    }

    .sidebar a:hover,
    .sidebar a.active {
      background-color: #007bff;
    }

    .main {
      flex-grow: 1;
      padding: 30px;
    }

    .main h1 {
      font-size: 2rem;
      margin-bottom: 25px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background-color: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    thead {
      background-color: #f0f0f0;
    }

    th, td {
      padding: 14px 16px;
      text-align: left;
      border-bottom: 1px solid #eee;
      font-size: 1rem;
    }

    tr:hover {
      background-color: #f9f9f9;
    }

    td img {
      border-radius: 6px;
      width: 60px;
      height: 60px;
      object-fit: cover;
    }

    button {
      padding: 6px 12px;
      margin-right: 6px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: 500;
      transition: 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    button:first-of-type {
      background-color: #007bff;
      color: white;
    }

    .remove-btn {
      background-color: #dc3545;
      color: white;
    }

    @media(max-width: 768px) {
      body {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
        text-align: center;
      }
      .main {
        padding: 20px;
      }
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <h2>Admin Panel</h2>
    <a href="admin.html">Dashboard</a>
    <a href="admin-products.html" class="active">Products</a>
    <a href="admin-orders.html">Orders</a>
    <a href="admin-users.html">Users</a>
    <a href="admin-add-product.html">Add Product</a>
    <a href="admin-settings.html">Settings</a>
    <a href="Login.html">Logout</a>
  </div>

  <!-- Main Content -->
  <div class="main">
    <h1>Products</h1>
    <table>
      <thead>
        <tr>
          <th>Image</th>
          <th>Name</th>
          <th>Price</th>
          <th>Stock</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td><img src="https://source.unsplash.com/60x60/?tshirt,black" alt="T-shirt" /></td>
          <td>Classic Black Tee</td>
          <td>₹799</td>
          <td>120</td>
          <td>
            <button>Edit</button>
            <button class="remove-btn">Delete</button>
          </td>
        </tr>
        <tr>
          <td><img src="https://source.unsplash.com/60x60/?tshirt,white" alt="T-shirt" /></td>
          <td>White Cotton Tee</td>
          <td>₹699</td>
          <td>85</td>
          <td>
            <button>Edit</button>
            <button class="remove-btn">Delete</button>
          </td>
        </tr>
        <tr>
          <td><img src="https://source.unsplash.com/60x60/?tshirt,blue" alt="T-shirt" /></td>
          <td>Sky Blue Tee</td>
          <td>₹749</td>
          <td>42</td>
          <td>
            <button>Edit</button>
            <button class="remove-btn">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</body>
</html>
